name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dorentme_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=dorentme_ci;User=root;Password=root;

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend
        run: dotnet restore backend/DoRentMe.sln

      - name: Build backend
        run: dotnet build backend/DoRentMe.sln --configuration Release --no-restore

      - name: Test backend
        run: dotnet test backend/DoRentMe.sln --configuration Release --no-build


  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: http://localhost:5000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t dorentme-backend:ci \
            ./backend/DoRentMe.Api

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=http://localhost:5000 \
            -t dorentme-frontend:ci \
            ./frontend