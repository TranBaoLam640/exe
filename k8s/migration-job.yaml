apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migration
  namespace: dorentme

spec:
  backoffLimit: 1

  template:
    metadata:
      labels:
        app: backend-migration

    spec:
      restartPolicy: Never

      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: migration
          image: ghcr.io/tranbaolam640/dorentme-backend:sha-836262682f454bb5856e5d135974e68cb717d0d7
          imagePullPolicy: IfNotPresent

          envFrom:
            - secretRef:
                name: backend-secret

          command:
            - /bin/sh
            - -c

          args:
            - |
              echo "Starting EF Core migration..."
              ./efbundle --connection "$ConnectionStrings__DefaultConnection"
              echo "Migration completed."
