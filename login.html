<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập | DoRentMe</title>
    <link rel="stylesheet" href="responsive.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        /* ===== HEADER ===== */
        header {
            position: fixed; top: 0; left: 0; width: 100%;
            padding: 8px 50px;
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
            z-index: 1000;
            background: rgba(10, 30, 20, 0.95);
            box-shadow: 0 2px 20px rgba(0,0,0,0.4);
        }
        .logo { grid-column: 1; }
        .logo img { height: 70px; width: auto; }
        .nav-menu { grid-column: 2; display: flex; gap: 50px; justify-content: center; }
        .nav-menu a { color: white; text-decoration: none; font-weight: 600; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.5px; transition: color 0.3s; position: relative; }
        .nav-menu a::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px; background: #8de9be; transition: width 0.3s; }
        .nav-menu a:hover { color: #8de9be; }
        .nav-menu a:hover::after { width: 100%; }
        .nav-right { grid-column: 3; display: flex; justify-content: flex-end; gap: 12px; align-items: center; }
        .nav-btn { padding: 8px 20px; border-radius: 25px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .nav-btn.outline { border: 2px solid #8de9be; color: #8de9be; background: transparent; }
        .nav-btn.outline:hover { background: #8de9be; color: #0a1e14; }
        .nav-btn.fill { background: #55b689; color: white; border: 2px solid #55b689; }
        .nav-btn.fill:hover { background: #3d9e70; border-color: #3d9e70; }
        .nav-item { position: relative; display: flex; align-items: center; }
        .nav-item > a { color: white; text-decoration: none; font-weight: 600; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.5px; transition: color 0.3s; position: relative; cursor: pointer; }
        .nav-item > a::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px; background: #8de9be; transition: width 0.3s; }
        .nav-item:hover > a { color: #8de9be; }
        .nav-item:hover > a::after { width: 100%; }
        .dropdown-menu { display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); padding-top: 14px; z-index: 200; min-width: 160px; }
        .nav-item:hover .dropdown-menu { display: block; }
        .dropdown-inner { background: rgba(10,30,20,0.97); border: 1px solid rgba(141,233,190,0.25); border-radius: 10px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
        .dropdown-menu a { display: block !important; padding: 11px 22px; color: rgba(255,255,255,0.88) !important; font-size: 0.85rem !important; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; transition: color 0.2s, background 0.2s; text-decoration: none; }
        .dropdown-menu a::after { display: none !important; }
        .dropdown-menu a:hover { color: #8de9be !important; background: rgba(141,233,190,0.08); }

        /* ===== AUTH PAGE ===== */
        .auth-page {
            margin-top: 90px; min-height: calc(100vh - 90px);
            background: linear-gradient(135deg, #0a1e14 0%, #f7f7f7 45%);
            display: flex; align-items: center; justify-content: center;
            padding: 40px 20px;
        }
        .auth-card {
            width: 100%; max-width: 420px; background: white; border-radius: 16px;
            padding: 36px 32px; box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }
        .auth-card .icon { text-align: center; font-size: 2.4rem; margin-bottom: 8px; }
        .auth-card h1 { text-align: center; font-size: 1.4rem; font-weight: 800; color: #0a1e14; margin-bottom: 6px; }
        .auth-card .sub { text-align: center; color: #888; font-size: 0.85rem; margin-bottom: 24px; }

        .form-row { margin-bottom: 14px; }
        .form-row label { display: block; font-size: 0.83rem; color: #555; margin-bottom: 6px; font-weight: 600; }
        .form-row input {
            width: 100%; padding: 11px 14px; border: 1.5px solid #ddd; border-radius: 8px;
            font-size: 0.9rem; font-family: inherit; outline: none; transition: border-color 0.2s;
        }
        .form-row input:focus { border-color: #55b689; }
        .form-row.invalid input { border-color: #c0392b; }

        .form-msg { font-size: 0.82rem; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
        .form-msg.error { background: #fff0f5; color: #c0392b; display: block; }
        .form-msg.success { background: #e8f8f1; color: #1a5c3a; display: block; }

        .btn-submit {
            width: 100%; padding: 13px 0; background: #55b689; color: white; border: none;
            border-radius: 8px; font-size: 0.95rem; font-weight: 800; cursor: pointer; transition: 0.3s;
        }
        .btn-submit:hover { background: #3d9e70; }
        .btn-submit:disabled { background: #b9d9c8; cursor: not-allowed; }

        .auth-switch { text-align: center; margin-top: 20px; font-size: 0.85rem; color: #888; }
        .auth-switch a { color: #55b689; font-weight: 700; text-decoration: none; }
        .auth-switch a:hover { text-decoration: underline; }
        .guest-link { display: block; text-align: center; margin-top: 10px; font-size: 0.8rem; color: #aaa; text-decoration: none; }
        .guest-link:hover { color: #888; text-decoration: underline; }
        .admin-link {
            display: block; text-align: center; margin-top: 18px; padding-top: 14px;
            border-top: 1px dashed #eee; font-size: 0.78rem; color: #bbb; text-decoration: none;
        }
        .admin-link:hover { color: #55b689; text-decoration: underline; }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header id="mainHeader">
        <div class="logo"><img src="Logo.png" alt="DoRentMe Logo"></div>
        <nav class="nav-menu">
            <a href="index.html">Trang chủ</a>
            <div class="nav-item">
                <a href="#">Dịch vụ</a>
                <div class="dropdown-menu">
                    <div class="dropdown-inner">
                        <a href="chatbotAI.html">AI Phối đồ</a>
                        <a href="ai-tryon.html">Thử đồ 3D</a>
                        <a href="shop.html">Shop</a>
                        <a href="news.html">Tin tức</a>
                    </div>
                </div>
            </div>
            <a href="about.html">Giới thiệu</a>
            <a href="contact.html">Liên hệ</a>
        </nav>
        <div class="nav-right">
            <a href="login.html" class="nav-btn outline">Đăng nhập</a>
            <a href="register.html" class="nav-btn fill">Đăng ký</a>
        </div>
    </header>

    <!-- ===== LOGIN BODY ===== -->
    <div class="auth-page">
        <div class="auth-card">
            <div class="icon">👋</div>
            <h1>Chào mừng trở lại</h1>
            <p class="sub">Đăng nhập để tiếp tục theo dõi đơn hàng & thông tin của bạn.</p>

            <div class="form-msg" id="formMsg"></div>

            <form id="loginForm">
                <div class="form-row" id="rowEmail">
                    <label>Email</label>
                    <input type="email" id="lEmail" placeholder="ban@email.com" autocomplete="email">
                </div>
                <div class="form-row" id="rowPassword">
                    <label>Mật khẩu</label>
                    <input type="password" id="lPassword" placeholder="Mật khẩu" autocomplete="current-password">
                </div>
                <button type="submit" class="btn-submit" id="btnLogin">Đăng nhập</button>
            </form>

            <div class="auth-switch">Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></div>
            <a href="shop.html" class="guest-link">Tiếp tục mua sắm không cần tài khoản →</a>
            <a href="shop-admin.html" class="admin-link">🔒 Bạn là admin? Đăng nhập ở đây →</a>
        </div>
    </div>

    <script src="cart.js"></script>
    <script src="orders.js"></script>
    <script src="auth.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const redirectTo = params.get('redirect') || 'index.html';

        const msgEl = document.getElementById('formMsg');
        function showMsg(text, type) {
            msgEl.textContent = text;
            msgEl.className = 'form-msg ' + type;
        }
        function toggleInvalid(rowId, invalid) {
            document.getElementById(rowId).classList.toggle('invalid', invalid);
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('lEmail').value;
            const password = document.getElementById('lPassword').value;

            toggleInvalid('rowEmail', false);
            toggleInvalid('rowPassword', false);
            msgEl.className = 'form-msg';

            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.textContent = 'Đang xử lý...';

            const res = await DoAuth.login(email, password);

            if (!res.ok) {
                btn.disabled = false;
                btn.textContent = 'Đăng nhập';
                toggleInvalid('rowEmail', true);
                toggleInvalid('rowPassword', true);
                showMsg(res.error, 'error');
                return;
            }

            showMsg('Đăng nhập thành công! Đang chuyển hướng...', 'success');
            setTimeout(() => { window.location.href = redirectTo; }, 500);
        });
    </script>
</body>
</html>
